<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RED API · Dev Dashboard</title>
<style>
  :root{--navy:#0B1C2D;--navy2:#12283f;--line:#1f3a57;--red:#c8102e;--gold:#F2A900;--ink:#e8eef5;--mute:#8aa0b6;--ok:#2fbf71;--warn:#F2A900;--bad:#c8102e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:#081624;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;letter-spacing:.3px}
  header h1 b{color:var(--red)}
  .pill{padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--mute)}
  .pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--bad);border-color:var(--bad)}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav button{background:none;border:1px solid transparent;color:var(--mute);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
  nav button.on{color:var(--ink);border-color:var(--line);background:var(--navy2)}
  main{padding:20px 22px;max-width:1400px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:var(--navy2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
  .big{font-size:26px;font-weight:700}
  .sub{color:var(--mute);font-size:12px}
  section{display:none} section.on{display:block}
  h2{font-size:15px;margin:22px 0 10px;color:var(--gold);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--navy2)}
  td code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .tbl{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--navy2)}
  .s2{color:var(--ok)} .s3{color:var(--mute)} .s4{color:var(--warn)} .s5{color:var(--bad)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{background:var(--navy2);border:1px solid var(--line);color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit}
  .tabs button.on{border-color:var(--red);color:#fff}
  svg{display:block;width:100%}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:900px){.row{grid-template-columns:1fr}}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px} .kv div:nth-child(odd){color:var(--mute)}
  footer{color:var(--mute);font-size:12px;padding:20px 22px;text-align:center}
</style>
</head>
<body>
<header>
  <h1><b>RED</b> API · Dev Dashboard</h1>
  <span id="status" class="pill">connecting…</span>
  <span class="pill" id="dbpill">db</span>
  <nav id="nav"></nav>
</header>
<main>
  <section id="overview"></section>
  <section id="database"></section>
  <section id="connections"></section>
  <section id="traffic"></section>
  <section id="users"></section>
  <section id="routes"></section>
  <section id="browse"></section>
</main>
<footer>Local and private: this page only answers on this machine. Auto-refresh every 5 seconds. <span id="updated"></span></footer>
<script>
const TABS=[["overview","Overview"],["database","Database"],["connections","Connections"],["traffic","Traffic"],["users","Users"],["routes","Endpoints"],["browse","Browse data"]];
let tab=location.hash.slice(1)||"overview", browseTable=null;
const $=s=>document.querySelector(s);
const esc=v=>v==null?'<span class="sub">–</span>':String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=iso=>{if(!iso)return"–";const s=(Date.now()-new Date(iso))/1000;if(s<60)return Math.round(s)+"s ago";if(s<3600)return Math.round(s/60)+"m ago";if(s<86400)return Math.round(s/3600)+"h ago";return Math.round(s/86400)+"d ago"};
const dur=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+"d ":"")+(h?h+"h ":"")+m+"m"};
const bytes=b=>b==null?"–":b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(1)+" MB";
const card=(t,v,s="")=>`<div class="card"><h3>${t}</h3><div class="big">${v}</div><div class="sub">${s}</div></div>`;
const tableHTML=(cols,rows,fmt={})=>`<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${fmt[c[0]]?fmt[c[0]](r[c[0]],r):esc(r[c[0]])}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" class="sub">Nothing yet.</td></tr>`}</tbody></table></div>`;
const statusCls=s=>"s"+String(s)[0];
async function get(p){const r=await fetch("/_dash/api/"+p);if(!r.ok)throw new Error(p+" "+r.status);return r.json()}
function bars(data,errs,h=120){const w=Math.max(1,data.length),max=Math.max(1,...data);return `<svg viewBox="0 0 ${w*10} ${h}" preserveAspectRatio="none" style="height:${h}px">${data.map((v,i)=>{const bh=v/max*(h-14),eh=(errs[i]||0)/max*(h-14);return `<rect x="${i*10+1}" y="${h-bh}" width="8" height="${bh}" fill="#2a5d8f"><title>${v} requests</title></rect><rect x="${i*10+1}" y="${h-eh}" width="8" height="${eh}" fill="#c8102e"/>`}).join("")}</svg><div class="sub">Requests per minute, oldest on the left (red = errors). Peak ${max}/min.</div>`}

function nav(){ $("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join(""); document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===tab)); }
function go(k){tab=k;location.hash=k;nav();refresh()}

const R={
 async overview(){const [o,c,t]=await Promise.all([get("overview"),get("checks"),get("traffic?minutes=60")]);const p=o.postgres||{};
  $("#dbpill").textContent=o.db_dialect+(p.size?" · "+p.size:"");
  $("#overview").innerHTML=`<div class="grid">
   ${card("API","up",`uptime ${dur(o.uptime_s)} · pid ${o.pid}`)}
   ${card("DB ping",o.db_ping_ms+" ms",esc(o.db_dialect)+" via "+esc(o.db_driver))}
   ${card("Users",o.counts.users,o.active_tokens+" signed-in sessions")}
   ${card("Contact messages",o.counts.contact_messages)}
   ${card("Requests (24h)",o.counts.requests_24h,o.counts.errors_24h+" errors")}
   ${p.connections!=null?card("DB connections",p.connections+" / "+p.max_connections):""}
   ${p.cache_hit_pct!=null?card("Cache hit",p.cache_hit_pct+"%","higher is better"):""}
   ${p.size?card("DB size",p.size,esc(p.db)):""}
  </div>
  <div class="row"><div><h2>Traffic, last hour</h2><div class="card">${bars(t.per_minute,t.errors_per_minute)}</div></div>
  <div><h2>Health checks</h2>${tableHTML([["path","Check"],["status","Status"],["ms","Time (ms)"]],c,{status:s=>`<span class="${statusCls(s)}">${s}</span>`})}
  <h2>Server</h2><div class="card kv">
   <div>Database</div><div class="mono">${esc(o.db_target)}</div>
   <div>Pool</div><div class="mono">${esc(o.pool)}</div>
   <div>Python</div><div>${esc(o.python)} on ${esc(o.host)}</div>
   ${p.version?`<div>Postgres</div><div class="mono">${esc(p.version.split(" on ")[0])}</div><div>Transactions</div><div>${p.xact_commit} committed · ${p.xact_rollback} rolled back · ${p.deadlocks} deadlocks</div><div>Rows written</div><div>${p.tup_inserted} inserted · ${p.tup_updated} updated · ${p.tup_deleted} deleted</div>`:""}
   ${o.sqlite?`<div>SQLite file</div><div class="mono">${esc(o.sqlite.file)} (${bytes(o.sqlite.size_bytes)})</div>`:""}
   <div>Started</div><div>${new Date(o.started_at).toLocaleString()}</div>
  </div></div></div>`;
  $("#status").className="pill ok";$("#status").textContent="API up";},
 async database(){const ts=await get("tables");
  $("#database").innerHTML=`<div class="grid">${ts.map(t=>card(t.name,t.rows,(t.stats?t.stats.total_size+" · ":"")+t.columns.length+" columns")).join("")}</div>`+
  ts.map(t=>`<h2>${esc(t.name)} <span class="sub">${t.rows} rows</span></h2><div class="row"><div>${tableHTML([["name","Column"],["type","Type"],["nullable","Null?"],["pk","Key"]],t.columns,{pk:v=>v?'<span style="color:var(--gold)">PK</span>':"",nullable:v=>v?"yes":"no",name:v=>`<code>${esc(v)}</code>`})}
   ${t.indexes.length?`<div class="sub" style="margin-top:6px">Indexes: ${t.indexes.map(i=>`<code>${esc(i.name)}</code> (${i.columns.join(", ")}${i.unique?", unique":""})`).join(" · ")}</div>`:""}
   ${t.foreign_keys.length?`<div class="sub">Links: ${t.foreign_keys.map(f=>`${f.columns.join(", ")} → ${esc(f.references)}`).join(" · ")}</div>`:""}</div>
   <div>${t.stats?`<div class="card kv"><div>Live rows</div><div>${t.stats.n_live_tup}</div><div>Dead rows</div><div>${t.stats.n_dead_tup}</div><div>Full scans</div><div>${t.stats.seq_scan}</div><div>Index scans</div><div>${t.stats.idx_scan??"–"}</div><div>Inserts / updates / deletes</div><div>${t.stats.n_tup_ins} / ${t.stats.n_tup_upd} / ${t.stats.n_tup_del}</div><div>Last auto-vacuum</div><div>${ago(t.stats.last_autovacuum)}</div><div>Last analyze</div><div>${ago(t.stats.last_autoanalyze||t.stats.last_analyze)}</div></div>`:'<div class="sub">Table stats need Postgres.</div>'}
   <p><button class="tabs" style="all:unset;cursor:pointer;color:var(--gold)" onclick="browseTable='${t.name}';go('browse')">Browse rows →</button></p></div></div>`).join("");},
 async connections(){const c=await get("connections");
  if(!c.supported){$("#connections").innerHTML=`<div class="card">${esc(c.note)}</div>`;return}
  $("#connections").innerHTML=`<div class="grid">${card("Open connections",c.connections.length)}${card("Active now",c.connections.filter(x=>x.state==="active").length)}${card("Idle",c.connections.filter(x=>x.state==="idle").length)}${card("Locks",c.locks.length,c.locks.filter(l=>!l.granted).length+" waiting")}</div>
  <h2>Connections to this database</h2>${tableHTML([["pid","PID"],["user","User"],["app","App"],["client","Client"],["state","State"],["backend_start","Connected"],["query_start","Last query"],["query","Query"]],c.connections,{backend_start:ago,query_start:ago,query:(v,r)=>`<code>${esc(v)}</code>${r.is_this_dashboard?' <span class="pill">this dashboard</span>':""}`,state:v=>v==="active"?`<span class="s2">active</span>`:esc(v)})}
  <h2>Locks</h2>${tableHTML([["pid","PID"],["locktype","Type"],["relname","Table"],["mode","Mode"],["granted","Granted"]],c.locks,{granted:v=>v?"yes":'<span class="s5">waiting</span>'})}
  <div class="sub" style="margin-top:8px">App pool: <span class="mono">${esc(c.pool)}</span></div>`;},
 async traffic(){const t=await get("traffic?minutes=60");
  $("#traffic").innerHTML=`<div class="card">${bars(t.per_minute,t.errors_per_minute,150)}</div>
  <div class="row"><div><h2>By endpoint (last hour)</h2>${tableHTML([["route","Endpoint"],["count","Calls"],["errors","Errors"],["avg_ms","Avg ms"],["p95_ms","p95 ms"]],t.routes,{route:v=>`<code>${esc(v)}</code>`,errors:v=>v?`<span class="s5">${v}</span>`:0})}</div>
  <div><h2>Clients (last hour)</h2>${tableHTML([["ip","IP"],["count","Calls"]],t.clients)}</div></div>
  <h2>Latest 200 requests</h2>${tableHTML([["ts","When"],["method","Method"],["path","Path"],["status","Status"],["ms","ms"],["ip","IP"],["user_id","User"],["user_agent","Client"]],t.recent,{ts:ago,path:v=>`<code>${esc(v)}</code>`,status:s=>`<span class="${statusCls(s)}">${s}</span>`,user_agent:v=>`<span class="sub">${esc((v||"").slice(0,60))}</span>`})}`;},
 async users(){const u=await get("users");
  $("#users").innerHTML=`<div class="grid">${card("Users",u.users.length)}${card("Signed in now",u.users.filter(x=>x.active_sessions).length)}${card("Contact messages",u.contact_messages.length,"latest 25 shown")}</div>
  <h2>Users</h2>${tableHTML([["id","ID"],["email","Email"],["name","Name"],["created_at","Joined"],["last_seen","Last seen"],["active_sessions","Sessions"]],u.users,{created_at:ago,last_seen:ago,active_sessions:v=>v?`<span class="s2">${v}</span>`:0})}
  <h2>Contact messages</h2>${tableHTML([["id","ID"],["created_at","When"],["name","Name"],["email","Email"],["company","Company"],["note","Note"]],u.contact_messages,{created_at:ago})}`;},
 async routes(){const r=await get("routes");
  $("#routes").innerHTML=`<h2>API endpoints</h2>${tableHTML([["methods","Methods"],["rule","Path"],["endpoint","Handler"]],r,{methods:v=>v.map(m=>`<span class="pill">${m}</span>`).join(" "),rule:v=>`<code>${esc(v)}</code>`})}`;},
 async browse(){const ts=await get("tables");if(!browseTable&&ts.length)browseTable=ts[0].name;
  const d=browseTable?await get("table/"+encodeURIComponent(browseTable)+"?limit=100"):{columns:[],rows:[]};
  $("#browse").innerHTML=`<div class="tabs">${ts.map(t=>`<button class="${t.name===browseTable?"on":""}" onclick="browseTable='${t.name}';refresh()">${esc(t.name)} (${t.rows})</button>`).join("")}</div>
  <div class="sub" style="margin-bottom:6px">Newest 100 rows. Password hashes are hidden.</div>${tableHTML(d.columns.map(c=>[c,c]),d.rows)}`;}
};
async function refresh(){try{await R[tab]();$("#updated").textContent="Updated "+new Date().toLocaleTimeString()}catch(e){$("#status").className="pill bad";$("#status").textContent="API not reachable";console.error(e)}}
addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(k&&k!==tab){tab=k;nav();refresh()}});
nav();refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
</script>
</body>
</html>
