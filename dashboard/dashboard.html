<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RED API · Dev Dashboard</title>
<style>
  :root{--navy:#0B1C2D;--navy2:#12283f;--line:#1f3a57;--red:#c8102e;--gold:#F2A900;--ink:#e8eef5;--mute:#8aa0b6;--ok:#2fbf71;--warn:#F2A900;--bad:#c8102e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:#081624;position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0;letter-spacing:.3px}
  header h1 b{color:var(--red)}
  .pill{padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--mute)}
  .pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--bad);border-color:var(--bad)}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav button{background:none;border:1px solid transparent;color:var(--mute);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
  nav button.on{color:var(--ink);border-color:var(--line);background:var(--navy2)}
  main{padding:20px 22px;max-width:1400px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:var(--navy2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
  .big{font-size:26px;font-weight:700}
  .sub{color:var(--mute);font-size:12px}
  section{display:none} section.on{display:block}
  h2{font-size:15px;margin:22px 0 10px;color:var(--gold);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--navy2)}
  td code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .tbl{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--navy2)}
  .s2{color:var(--ok)} .s3{color:var(--mute)} .s4{color:var(--warn)} .s5{color:var(--bad)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{background:var(--navy2);border:1px solid var(--line);color:var(--ink);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit}
  .tabs button.on{border-color:var(--red);color:#fff}
  svg{display:block;width:100%}
  .charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
  .chart .legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-top:4px}.chart .legend i{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle}
  .chart .now{float:right;font-size:13px;color:var(--ink)}
  .er{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#081624}
  .er svg{width:auto;max-width:none}
  .er .tb{cursor:pointer} .er .tb:hover rect.hd{fill:#a00d25}
  .bar{height:8px;border-radius:4px;background:#2a5d8f;display:inline-block;vertical-align:middle}
  .chip{display:inline-block;padding:1px 7px;margin:1px 3px 1px 0;border-radius:6px;font-size:11px;border:1px solid var(--line)}
  .chip.r{color:#4ea3ff;border-color:#24527d} .chip.w{color:#ff6b81;border-color:#7d2433} .chip.k{color:var(--gold);border-color:#6b5310}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:900px){.row{grid-template-columns:1fr}}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px} .kv div:nth-child(odd){color:var(--mute)}
  footer{color:var(--mute);font-size:12px;padding:20px 22px;text-align:center}
</style>
</head>
<body>
<header>
  <h1><b>RED</b> API · Dev Dashboard</h1>
  <span id="status" class="pill">connecting…</span>
  <span class="pill" id="dbpill">db</span>
  <nav id="nav"></nav>
</header>
<main>
  <section id="live"></section>
  <section id="overview"></section>
  <section id="database"></section>
  <section id="connections"></section>
  <section id="traffic"></section>
  <section id="users"></section>
  <section id="routes"></section>
  <section id="browse"></section>
</main>
<footer>Local and private: this page only answers on this machine. Live graphs update every 2 seconds, other tabs every 5. <span id="updated"></span></footer>
<script>
const TABS=[["live","Live"],["overview","Overview"],["database","Database"],["connections","Connections"],["traffic","Traffic"],["users","Users"],["routes","APIs & integrations"],["browse","Browse data"]];
let tab=location.hash.slice(1)||"live", browseTable=null;
const $=s=>document.querySelector(s);
const esc=v=>v==null?'<span class="sub">–</span>':String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=iso=>{if(!iso)return"–";const s=(Date.now()-new Date(iso))/1000;if(s<60)return Math.round(s)+"s ago";if(s<3600)return Math.round(s/60)+"m ago";if(s<86400)return Math.round(s/3600)+"h ago";return Math.round(s/86400)+"d ago"};
const dur=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+"d ":"")+(h?h+"h ":"")+m+"m"};
const bytes=b=>b==null?"–":b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(1)+" MB";
const card=(t,v,s="")=>`<div class="card"><h3>${t}</h3><div class="big">${v}</div><div class="sub">${s}</div></div>`;
const tableHTML=(cols,rows,fmt={})=>`<div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${fmt[c[0]]?fmt[c[0]](r[c[0]],r):esc(r[c[0]])}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" class="sub">Nothing yet.</td></tr>`}</tbody></table></div>`;
const statusCls=s=>"s"+String(s)[0];
async function get(p){const r=await fetch("/_dash/api/"+p);if(!r.ok)throw new Error(p+" "+r.status);return r.json()}
function bars(data,errs,h=120){const w=Math.max(1,data.length),max=Math.max(1,...data);return `<svg viewBox="0 0 ${w*10} ${h}" preserveAspectRatio="none" style="height:${h}px">${data.map((v,i)=>{const bh=v/max*(h-14),eh=(errs[i]||0)/max*(h-14);return `<rect x="${i*10+1}" y="${h-bh}" width="8" height="${bh}" fill="#2a5d8f"><title>${v} requests</title></rect><rect x="${i*10+1}" y="${h-eh}" width="8" height="${eh}" fill="#c8102e"/>`}).join("")}</svg><div class="sub">Requests per minute, oldest on the left (red = errors). Peak ${max}/min.</div>`}

function nav(){ $("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join(""); document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===tab)); }
function go(k){tab=k;location.hash=k;nav();refresh()}

const R={
 async overview(){const [o,c,t]=await Promise.all([get("overview"),get("checks"),get("traffic?minutes=60")]);const p=o.postgres||{};
  $("#dbpill").textContent=o.db_dialect+(p.size?" · "+p.size:"");
  $("#overview").innerHTML=`<div class="grid">
   ${card("API","up",`uptime ${dur(o.uptime_s)} · pid ${o.pid}`)}
   ${card("DB ping",o.db_ping_ms+" ms",esc(o.db_dialect)+" via "+esc(o.db_driver))}
   ${card("Users",o.counts.users,o.active_tokens+" signed-in sessions")}
   ${card("Contact messages",o.counts.contact_messages)}
   ${card("Requests (24h)",o.counts.requests_24h,o.counts.errors_24h+" errors")}
   ${p.connections!=null?card("DB connections",p.connections+" / "+p.max_connections):""}
   ${p.cache_hit_pct!=null?card("Cache hit",p.cache_hit_pct+"%","higher is better"):""}
   ${p.size?card("DB size",p.size,esc(p.db)):""}
  </div>
  <div class="row"><div><h2>Traffic, last hour</h2><div class="card">${bars(t.per_minute,t.errors_per_minute)}</div></div>
  <div><h2>Health checks</h2>${tableHTML([["path","Check"],["status","Status"],["ms","Time (ms)"]],c,{status:s=>`<span class="${statusCls(s)}">${s}</span>`})}
  <h2>Server</h2><div class="card kv">
   <div>Database</div><div class="mono">${esc(o.db_target)}</div>
   <div>Pool</div><div class="mono">${esc(o.pool)}</div>
   <div>Python</div><div>${esc(o.python)} on ${esc(o.host)}</div>
   ${p.version?`<div>Postgres</div><div class="mono">${esc(p.version.split(" on ")[0])}</div><div>Transactions</div><div>${p.xact_commit} committed · ${p.xact_rollback} rolled back · ${p.deadlocks} deadlocks</div><div>Rows written</div><div>${p.tup_inserted} inserted · ${p.tup_updated} updated · ${p.tup_deleted} deleted</div>`:""}
   ${o.sqlite?`<div>SQLite file</div><div class="mono">${esc(o.sqlite.file)} (${bytes(o.sqlite.size_bytes)})</div>`:""}
   <div>Started</div><div>${new Date(o.started_at).toLocaleString()}</div>
  </div></div></div>`;
  $("#status").className="pill ok";$("#status").textContent="API up";},
 async database_old(){const ts=await get("tables");
  $("#database").innerHTML=`<div class="grid">${ts.map(t=>card(t.name,t.rows,(t.stats?t.stats.total_size+" · ":"")+t.columns.length+" columns")).join("")}</div>`+
  ts.map(t=>`<h2>${esc(t.name)} <span class="sub">${t.rows} rows</span></h2><div class="row"><div>${tableHTML([["name","Column"],["type","Type"],["nullable","Null?"],["pk","Key"]],t.columns,{pk:v=>v?'<span style="color:var(--gold)">PK</span>':"",nullable:v=>v?"yes":"no",name:v=>`<code>${esc(v)}</code>`})}
   ${t.indexes.length?`<div class="sub" style="margin-top:6px">Indexes: ${t.indexes.map(i=>`<code>${esc(i.name)}</code> (${i.columns.join(", ")}${i.unique?", unique":""})`).join(" · ")}</div>`:""}
   ${t.foreign_keys.length?`<div class="sub">Links: ${t.foreign_keys.map(f=>`${f.columns.join(", ")} → ${esc(f.references)}`).join(" · ")}</div>`:""}</div>
   <div>${t.stats?`<div class="card kv"><div>Live rows</div><div>${t.stats.n_live_tup}</div><div>Dead rows</div><div>${t.stats.n_dead_tup}</div><div>Full scans</div><div>${t.stats.seq_scan}</div><div>Index scans</div><div>${t.stats.idx_scan??"–"}</div><div>Inserts / updates / deletes</div><div>${t.stats.n_tup_ins} / ${t.stats.n_tup_upd} / ${t.stats.n_tup_del}</div><div>Last auto-vacuum</div><div>${ago(t.stats.last_autovacuum)}</div><div>Last analyze</div><div>${ago(t.stats.last_autoanalyze||t.stats.last_analyze)}</div></div>`:'<div class="sub">Table stats need Postgres.</div>'}
   <p><button class="tabs" style="all:unset;cursor:pointer;color:var(--gold)" onclick="browseTable='${t.name}';go('browse')">Browse rows →</button></p></div></div>`).join("");},
 async connections(){const c=await get("connections");
  if(!c.supported){$("#connections").innerHTML=`<div class="card">${esc(c.note)}</div>`;return}
  $("#connections").innerHTML=`<div class="grid">${card("Open connections",c.connections.length)}${card("Active now",c.connections.filter(x=>x.state==="active").length)}${card("Idle",c.connections.filter(x=>x.state==="idle").length)}${card("Locks",c.locks.length,c.locks.filter(l=>!l.granted).length+" waiting")}</div>
  <h2>Connections to this database</h2>${tableHTML([["pid","PID"],["user","User"],["app","App"],["client","Client"],["state","State"],["backend_start","Connected"],["query_start","Last query"],["query","Query"]],c.connections,{backend_start:ago,query_start:ago,query:(v,r)=>`<code>${esc(v)}</code>${r.is_this_dashboard?' <span class="pill">this dashboard</span>':""}`,state:v=>v==="active"?`<span class="s2">active</span>`:esc(v)})}
  <h2>Locks</h2>${tableHTML([["pid","PID"],["locktype","Type"],["relname","Table"],["mode","Mode"],["granted","Granted"]],c.locks,{granted:v=>v?"yes":'<span class="s5">waiting</span>'})}
  <div class="sub" style="margin-top:8px">App pool: <span class="mono">${esc(c.pool)}</span></div>`;},
 async traffic(){const t=await get("traffic?minutes=60");
  $("#traffic").innerHTML=`<div class="card">${bars(t.per_minute,t.errors_per_minute,150)}</div>
  <div class="row"><div><h2>By endpoint (last hour)</h2>${tableHTML([["route","Endpoint"],["count","Calls"],["errors","Errors"],["avg_ms","Avg ms"],["p95_ms","p95 ms"]],t.routes,{route:v=>`<code>${esc(v)}</code>`,errors:v=>v?`<span class="s5">${v}</span>`:0})}</div>
  <div><h2>Clients (last hour)</h2>${tableHTML([["ip","IP"],["count","Calls"]],t.clients)}</div></div>
  <h2>Latest 200 requests</h2>${tableHTML([["ts","When"],["method","Method"],["path","Path"],["status","Status"],["ms","ms"],["ip","IP"],["user_id","User"],["user_agent","Client"]],t.recent,{ts:ago,path:v=>`<code>${esc(v)}</code>`,status:s=>`<span class="${statusCls(s)}">${s}</span>`,user_agent:v=>`<span class="sub">${esc((v||"").slice(0,60))}</span>`})}`;},
 async users(){const u=await get("users");
  $("#users").innerHTML=`<div class="grid">${card("Users",u.users.length)}${card("Signed in now",u.users.filter(x=>x.active_sessions).length)}${card("Contact messages",u.contact_messages.length,"latest 25 shown")}</div>
  <h2>Users</h2>${tableHTML([["id","ID"],["email","Email"],["name","Name"],["created_at","Joined"],["last_seen","Last seen"],["active_sessions","Sessions"]],u.users,{created_at:ago,last_seen:ago,active_sessions:v=>v?`<span class="s2">${v}</span>`:0})}
  <h2>Contact messages</h2>${tableHTML([["id","ID"],["created_at","When"],["name","Name"],["email","Email"],["company","Company"],["note","Note"]],u.contact_messages,{created_at:ago})}`;},
 async routes_old(){const r=await get("routes");
  $("#routes").innerHTML=`<h2>API endpoints</h2>${tableHTML([["methods","Methods"],["rule","Path"],["endpoint","Handler"]],r,{methods:v=>v.map(m=>`<span class="pill">${m}</span>`).join(" "),rule:v=>`<code>${esc(v)}</code>`})}`;},
 async browse(){const ts=await get("tables");if(!browseTable&&ts.length)browseTable=ts[0].name;
  const d=browseTable?await get("table/"+encodeURIComponent(browseTable)+"?limit=100"):{columns:[],rows:[]};
  $("#browse").innerHTML=`<div class="tabs">${ts.map(t=>`<button class="${t.name===browseTable?"on":""}" onclick="browseTable='${t.name}';refresh()">${esc(t.name)} (${t.rows})</button>`).join("")}</div>
  <div class="sub" style="margin-bottom:6px">Newest 100 rows. Password hashes are hidden.</div>${tableHTML(d.columns.map(c=>[c,c]),d.rows)}`;}
};

const fmtB=v=>v<1024?Math.round(v)+" B/s":v<1048576?(v/1024).toFixed(1)+" KB/s":(v/1048576).toFixed(2)+" MB/s";
const fmtN=d=>v=>(+v).toFixed(d);
let liveBuf=[],liveLast=0;
function lineChart(title,series,fmt,opts={}){
  const W=600,H=opts.h||150,P=4,n=liveBuf.length;
  const vals=series.flatMap(s=>liveBuf.map(x=>+(x[s.k]??0)));
  let max=Math.max(opts.min||0,...vals,0.0001); if(opts.max)max=opts.max;
  const t0=n?liveBuf[0].t:0,t1=n?liveBuf[n-1].t:1,span=Math.max(1,t1-t0);
  const X=t=>P+(t-t0)/span*(W-2*P),Y=v=>H-P-(v/max)*(H-2*P-12);
  const paths=series.map(s=>{if(n<2)return"";const pts=liveBuf.map(x=>`${X(x.t).toFixed(1)},${Y(+(x[s.k]??0)).toFixed(1)}`);
    return (s.fill?`<path d="M${X(t0)},${H-P} L${pts.join(" L")} L${X(t1)},${H-P} Z" fill="${s.color}" opacity=".18"/>`:"")+`<polyline points="${pts.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" vector-effect="non-scaling-stroke"/>`}).join("");
  const grid=[.25,.5,.75,1].map(f=>`<line x1="0" x2="${W}" y1="${Y(max*f)}" y2="${Y(max*f)}" stroke="#1f3a57" stroke-width="1"/>`).join("");
  const last=liveBuf[n-1]||{};
  return `<div class="card chart"><h3>${title}<span class="now">${series.map(s=>`<span style="color:${s.color}">${fmt(last[s.k]??0)}</span>`).join(" · ")}</span></h3>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${grid}<text x="${W-4}" y="12" fill="#8aa0b6" font-size="11" text-anchor="end">${fmt(max)}</text>${paths}</svg>
  <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}<span style="margin-left:auto">last ${Math.round(span/60000)||"<1"} min</span></div></div>`}
function donut(title,counts){const colors={"2xx":"#2fbf71","3xx":"#8aa0b6","4xx":"#F2A900","5xx":"#c8102e"};const tot=Object.values(counts).reduce((a,b)=>a+b,0)||1;let a=0;
  const segs=Object.entries(counts).sort().map(([k,v])=>{const f=v/tot,a0=a;a+=f;const L=f>.5?1:0,r=60,c=70,p=t=>[c+r*Math.sin(2*Math.PI*t),c-r*Math.cos(2*Math.PI*t)];const[x0,y0]=p(a0),[x1,y1]=p(Math.min(a,.9999));
   return `<path d="M${x0},${y0} A${r},${r} 0 ${L} 1 ${x1},${y1}" stroke="${colors[k]||"#2a5d8f"}" stroke-width="18" fill="none"><title>${k}: ${v}</title></path>`}).join("");
  return `<div class="card chart"><h3>${title}</h3><div style="display:flex;align-items:center;gap:20px"><svg viewBox="0 0 140 140" style="width:140px;height:140px">${segs}<text x="70" y="76" text-anchor="middle" fill="#e8eef5" font-size="20" font-weight="700">${tot===1&&!Object.keys(counts).length?0:tot}</text></svg>
  <div class="legend" style="flex-direction:column">${Object.entries(counts).sort().map(([k,v])=>`<span><i style="background:${colors[k]}"></i>${k}: ${v} (${Math.round(v/tot*100)}%)</span>`).join("")||"No requests yet."}</div></div></div>`}
R.live=async function(){const d=await get("live?since="+liveLast);for(const x of d.samples){liveBuf.push(x);liveLast=x.t}if(liveBuf.length>900)liveBuf=liveBuf.slice(-900);
  const status={};liveBuf.forEach(x=>Object.entries(x.status||{}).forEach(([k,v])=>status[k]=(status[k]||0)+v));
  const pg=liveBuf.some(x=>x.db_total!=null);
  $("#live").innerHTML=`<div class="charts">
   ${lineChart("Network activity (server)",[{k:"net_rx_bps",name:"received",color:"#4ea3ff",fill:1},{k:"net_tx_bps",name:"sent",color:"#F2A900"}],fmtB)}
   ${lineChart("API requests per second",[{k:"rps",name:"requests",color:"#4ea3ff",fill:1},{k:"eps",name:"errors",color:"#c8102e"}],fmtN(2))}
   ${lineChart("API response time (ms)",[{k:"avg_ms",name:"average",color:"#2fbf71",fill:1},{k:"max_ms",name:"slowest",color:"#F2A900"}],fmtN(1))}
   ${lineChart("API data in and out",[{k:"app_in_bps",name:"request bodies",color:"#4ea3ff",fill:1},{k:"app_out_bps",name:"responses",color:"#F2A900"}],fmtB)}
   ${pg?lineChart("Database connections",[{k:"db_total",name:"total",color:"#4ea3ff",fill:1},{k:"db_active",name:"active",color:"#2fbf71"},{k:"db_idle",name:"idle",color:"#8aa0b6"}],fmtN(0),{min:5}):""}
   ${pg?lineChart("Database work per second",[{k:"db_tps",name:"transactions",color:"#4ea3ff",fill:1},{k:"db_rows_written_ps",name:"rows written",color:"#c8102e"}],fmtN(1)):""}
   ${lineChart("Database ping (ms)",[{k:"db_ping_ms",name:"SELECT 1 round trip",color:"#2fbf71",fill:1}],fmtN(2))}
   ${lineChart("Server CPU (%)",[{k:"cpu_pct",name:"CPU busy",color:"#c8102e",fill:1}],fmtN(1),{max:100})}
   ${lineChart("API memory (MB)",[{k:"rss_mb",name:"process memory",color:"#F2A900",fill:1}],fmtN(1),{min:10})}
   ${donut("Response codes (last 30 min)",status)}
  </div><div class="sub" style="margin-top:8px">Sampled every 2 seconds; the page keeps the last 30 minutes.</div>`};

let dbSel=null,apiCache=null;
function erDiagram(m){
  const BW=230,RH=20,HH=30,GX=90,GY=40,perRow=Math.max(1,Math.min(4,m.tables.length));
  const fkCols=new Set(m.relationships.map(r=>r.from+"."+r.from_cols[0]));
  const pos={};let x=20,y=20,rowH=0;
  m.tables.forEach((t,i)=>{if(i&&i%perRow===0){x=20;y+=rowH+GY;rowH=0}const h=HH+t.columns.length*RH+8;pos[t.name]={x,y,h,t};rowH=Math.max(rowH,h);x+=BW+GX});
  const W=20+perRow*(BW+GX),H=y+rowH+20;
  const colY=(t,c)=>{const p=pos[t];const i=p.t.columns.findIndex(k=>k.name===c);return p.y+HH+Math.max(0,i)*RH+RH/2+4};
  const links=m.relationships.map(r=>{const a=pos[r.from],b=pos[r.to];if(!a||!b)return"";
    const y1=colY(r.from,r.from_cols[0]),y2=colY(r.to,r.to_cols[0]);const right=a.x<b.x;
    const x1=right?a.x+BW:a.x,x2=right?b.x:b.x+BW,dx=right?60:-60;
    return `<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" fill="none" stroke="${r.kind==="inferred"?"#F2A900":"#4ea3ff"}" stroke-width="2" ${r.kind==="inferred"?'stroke-dasharray="6 4"':""}><title>${r.from}.${r.from_cols.join(",")} → ${r.to}.${r.to_cols.join(",")} (${r.kind})</title></path><circle cx="${x2}" cy="${y2}" r="4" fill="${r.kind==="inferred"?"#F2A900":"#4ea3ff"}"/>`}).join("");
  const boxes=Object.values(pos).map(({x,y,h,t})=>`<g class="tb" onclick="dbSel='${t.name}';refresh()">
    <rect x="${x}" y="${y}" width="${BW}" height="${h}" rx="10" fill="#12283f" stroke="${t.name===dbSel?"#c8102e":"#1f3a57"}" stroke-width="${t.name===dbSel?2:1}"/>
    <rect class="hd" x="${x}" y="${y}" width="${BW}" height="${HH}" rx="10" fill="#c8102e"/><rect x="${x}" y="${y+HH-10}" width="${BW}" height="10" fill="#c8102e" class="hd"/>
    <text x="${x+12}" y="${y+20}" fill="#fff" font-size="13" font-weight="700">${esc(t.name)}</text><text x="${x+BW-12}" y="${y+20}" fill="#ffd7dd" font-size="11" text-anchor="end">${t.rows} rows</text>
    ${t.columns.map((c,i)=>{const cy=y+HH+i*RH+RH/2+8;const key=c.pk?"PK":fkCols.has(t.name+"."+c.name)?"FK":c.unique?"UQ":"";
      return `<text x="${x+12}" y="${cy}" font-size="12" fill="${c.hidden?"#5d7690":"#e8eef5"}" font-family="ui-monospace,monospace">${esc(c.name)}</text>
      <text x="${x+BW-40}" y="${cy}" font-size="10" fill="#8aa0b6" text-anchor="end">${esc(c.type.toLowerCase().slice(0,16))}${c.nullable?"":" *"}</text>
      <text x="${x+BW-10}" y="${cy}" font-size="10" fill="${key==="PK"?"#F2A900":key==="FK"?"#4ea3ff":"#2fbf71"}" text-anchor="end" font-weight="700">${key}</text>`}).join("")}</g>`).join("");
  return `<div class="er"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${links}${boxes}</svg></div>
  <div class="legend sub" style="margin-top:6px">Click a table to inspect it. <span style="color:#F2A900">PK</span> primary key · <span style="color:#4ea3ff">FK</span> link to another table · <span style="color:#2fbf71">UQ</span> unique · * required. Solid blue line = declared foreign key; dashed gold line = link implied by a <code>*_id</code> column with no foreign key yet.</div>`}
function hbars(items,fmt){const max=Math.max(1,...items.map(i=>i.v));return `<div class="card">${items.map(i=>`<div style="display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;margin:5px 0"><code>${esc(i.k)}</code><span><span class="bar" style="width:${Math.max(2,i.v/max*100)}%;background:${i.c||"#2a5d8f"}"></span></span><span class="sub" style="text-align:right">${fmt(i.v)}</span></div>`).join("")}</div>`}
function growthBars(g){if(!g.length)return'<div class="sub">No time column on this table.</div>';const max=Math.max(1,...g.map(d=>d.count));const W=g.length*12;
  return `<svg viewBox="0 0 ${W} 90" preserveAspectRatio="none" style="height:90px">${g.map((d,i)=>`<rect x="${i*12+1}" y="${88-d.count/max*80}" width="10" height="${d.count/max*80}" fill="#c8102e"><title>${d.day}: ${d.count} rows</title></rect>`).join("")}</svg><div class="sub">New rows per day, last 31 days (peak ${max}).</div>`}
R.database=async function(){
  const [m,a]=await Promise.all([get("dbmap"),get("apimap")]);apiCache=a;
  if(!dbSel||!m.tables.find(t=>t.name===dbSel))dbSel=m.tables.length?m.tables[0].name:null;
  const p=dbSel?await get("profile/"+encodeURIComponent(dbSel)):null;const t=m.tables.find(x=>x.name===dbSel);
  const nIdx=m.tables.reduce((s,t)=>s+t.indexes.length,0),nCols=m.tables.reduce((s,t)=>s+t.columns.length,0);
  const usedBy=a.routes.filter(r=>r.reads.includes(dbSel)||r.writes.includes(dbSel));
  const pc=p?Object.fromEntries(p.columns.map(c=>[c.name,c])):{};
  $("#database").innerHTML=`<div class="grid">
    ${card("Databases on server",m.databases.length,m.databases.map(d=>d.name+(d.is_current?" (this one)":"")).join(", "))}
    ${card("Tables",m.tables.length,nCols+" columns")}
    ${card("Total rows",m.total_rows.toLocaleString())}
    ${m.total_bytes!=null?card("Size of tables",bytes(m.total_bytes),"data plus indexes"):""}
    ${card("Relationships",m.relationships.length,m.relationships.filter(r=>r.kind==="foreign key").length+" declared, "+m.relationships.filter(r=>r.kind==="inferred").length+" implied")}
    ${card("Indexes",nIdx)}
    ${card("APIs using the DB",a.routes.filter(r=>r.reads.length||r.writes.length>1).length+" of "+a.routes.length)}
  </div>
  <h2>Structure and relationships</h2>${erDiagram(m)}
  <div class="row"><div><h2>Rows per table</h2>${hbars(m.tables.map(t=>({k:t.name,v:t.rows})),v=>v.toLocaleString())}</div>
  <div><h2>${m.total_bytes!=null?"Disk size per table":"Databases"}</h2>${m.total_bytes!=null?hbars(m.tables.map(t=>({k:t.name,v:t.size_bytes||0,c:"#F2A900"})),bytes):""}
   ${tableHTML([["name","Database"],["size","Size"],["connections","Connections"]],m.databases,{name:(v,r)=>esc(v)+(r.is_current?' <span class="pill ok">this API</span>':"")})}</div></div>
  ${t?`<h2>Table: ${esc(t.name)} <span class="sub">${t.rows.toLocaleString()} rows${t.model?" · model "+esc(t.model):""}${t.size_bytes!=null?" · "+bytes(t.size_bytes):""}</span></h2>
  <div class="tabs">${m.tables.map(x=>`<button class="${x.name===dbSel?"on":""}" onclick="dbSel='${x.name}';refresh()">${esc(x.name)}</button>`).join("")}</div>
  ${tableHTML([["name","Column"],["type","Type"],["key","Key"],["nullable","Required"],["nulls","Empty"],["distinct","Distinct"],["range","Range / average"],["top","Most common values"]],
    t.columns.map(c=>({...c,key:c.pk?"PK":m.relationships.some(r=>r.from===t.name&&r.from_cols.includes(c.name))?"FK":c.unique?"UQ":"",...(pc[c.name]||{})})),
    {name:v=>`<code>${esc(v)}</code>`,nullable:v=>v?"no":"yes",key:v=>v?`<span class="chip k">${v}</span>`:"",
     nulls:(v,r)=>r.hidden?'<span class="sub">hidden</span>':v==null?"–":`${v}${p.rows?` <span class="sub">(${Math.round(v/p.rows*100)}%)</span>`:""}`,
     range:(v,r)=>r.min!=null?`<span class="mono">${esc(String(r.min).slice(0,19))} → ${esc(String(r.max).slice(0,19))}</span>${r.avg!=null?`<div class="sub">avg ${r.avg}</div>`:""}`:"",
     top:(v,r)=>(v||[]).map(x=>`<div style="display:flex;gap:6px;align-items:center"><span class="bar" style="width:${Math.max(4,x.count/(p.rows||1)*80)}px"></span><span class="mono">${esc(String(x.value).slice(0,28))}</span><span class="sub">${x.count}</span></div>`).join("")})}
  <div class="row"><div><h2>Growth</h2><div class="card">${growthBars(p.growth)}</div>
   <h2>Indexes</h2>${tableHTML([["name","Index"],["columns","Columns"],["unique","Unique"],["scans","Times used"],["size_bytes","Size"]],t.indexes,{name:v=>`<code>${esc(v)}</code>`,columns:v=>v.join(", "),unique:v=>v?"yes":"no",size_bytes:bytes})}</div>
   <div><h2>APIs that use this table</h2>${tableHTML([["methods","Method"],["rule","Path"],["use","Uses it to"],["calls_24h","Calls (24h)"]],usedBy.map(r=>({...r,use:[r.reads.includes(dbSel)?"read":"",r.writes.includes(dbSel)?"write":""].filter(Boolean).join(" + ")})),
     {methods:v=>v.join(" "),rule:v=>`<code>${esc(v)}</code>`,use:v=>v.split(" + ").map(u=>`<span class="chip ${u==="read"?"r":"w"}">${u}</span>`).join("")})}
   <p><a href="#browse" style="color:var(--gold)" onclick="browseTable='${t.name}'">Browse the rows of ${esc(t.name)} →</a></p></div></div>`:""}`};
function flowDiagram(a,tables){const routes=a.routes,RH=26,W=760,H=Math.max(routes.length,tables.length)*RH+30,lx=250,rx=560;
  const ry=i=>20+i*RH,ty=i=>20+i*RH*Math.max(1,routes.length/Math.max(1,tables.length))*0.999;
  const tIdx=Object.fromEntries(tables.map((t,i)=>[t,i]));
  const lines=routes.flatMap((r,i)=>[...r.reads.map(t=>[t,"#4ea3ff"]),...r.writes.filter(t=>t!=="request_log").map(t=>[t,"#ff6b81"])].map(([t,c])=>tIdx[t]==null?"":`<path d="M${lx},${ry(i)} C${lx+150},${ry(i)} ${rx-150},${ty(tIdx[t])} ${rx},${ty(tIdx[t])}" stroke="${c}" stroke-width="2" fill="none" opacity=".85"/>`)).join("");
  return `<div class="er"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${lines}
   ${routes.map((r,i)=>`<text x="${lx-10}" y="${ry(i)+4}" text-anchor="end" fill="#e8eef5" font-size="12" font-family="ui-monospace,monospace">${r.methods.join(",")} ${esc(r.rule)}</text><circle cx="${lx}" cy="${ry(i)}" r="4" fill="#8aa0b6"/>`).join("")}
   ${tables.map((t,i)=>`<rect x="${rx}" y="${ty(i)-11}" width="170" height="22" rx="6" fill="#c8102e"/><text x="${rx+10}" y="${ty(i)+4}" fill="#fff" font-size="12" font-weight="700">${esc(t)}</text>`).join("")}
  </svg></div><div class="sub" style="margin-top:6px"><span style="color:#4ea3ff">Blue</span> = reads, <span style="color:#ff6b81">red</span> = writes. Every call also writes one row to <code>request_log</code> (not drawn).</div>`}
R.routes=async function(){const [a,i,m]=await Promise.all([get("apimap"),get("integrations"),get("dbmap")]);
  $("#routes").innerHTML=`<h2>Integrations</h2><div class="grid">${i.integrations.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><div style="font-size:16px;font-weight:700;color:${/down|missing/.test(x.status)?"#c8102e":"#2fbf71"}">${esc(x.status)}</div><div class="sub">${esc(x.kind)}${x.ping_ms!=null?" · "+x.ping_ms+" ms":""}</div><div class="sub mono" style="margin-top:6px;word-break:break-all">${esc(x.detail)}</div></div>`).join("")}</div>
  <h2>Which APIs touch which tables</h2>${flowDiagram(a,m.tables.map(t=>t.name).filter(n=>n!=="request_log"))}
  <h2>API endpoints</h2>${tableHTML([["methods","Method"],["rule","Path"],["auth","Sign-in"],["reads","Reads"],["writes","Writes"],["notes","Also"],["calls_24h","Calls (24h)"],["errors_24h","Errors"],["avg_ms","Avg ms"]],a.routes,
   {methods:v=>v.map(x=>`<span class="pill">${x}</span>`).join(" "),rule:v=>`<code>${esc(v)}</code>`,auth:v=>v?'<span class="chip k">required</span>':'<span class="sub">open</span>',
    reads:v=>v.map(t=>`<span class="chip r">${esc(t)}</span>`).join(""),writes:v=>v.map(t=>`<span class="chip w">${esc(t)}</span>`).join(""),notes:v=>v.map(n=>`<span class="sub">${esc(n)}</span>`).join("<br>"),errors_24h:v=>v?`<span class="s5">${v}</span>`:0})}
  <div class="row"><div><h2>Settings the API reads</h2>${tableHTML([["name","Variable"],["set","Set?"],["value","Value"]],i.env,{name:v=>`<code>${esc(v)}</code>`,set:v=>v?'<span class="s2">yes</span>':'<span class="sub">default</span>',value:v=>`<span class="mono">${esc(v)}</span>`})}</div>
  <div><h2>Websites allowed to call the API</h2>${tableHTML([["o","Origin"]],i.cors.map(o=>({o})),{o:v=>`<code>${esc(v)}</code>`})}</div></div>`};
async function refresh(){try{await R[tab]();$("#status").className="pill ok";$("#status").textContent="API up";$("#updated").textContent="Updated "+new Date().toLocaleTimeString()}catch(e){$("#status").className="pill bad";$("#status").textContent="API not reachable";console.error(e)}}
addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(k&&k!==tab){tab=k;nav();refresh()}});
nav();refresh();setInterval(()=>{if(!document.hidden&&tab!=="live")refresh()},5000);setInterval(()=>{if(!document.hidden&&tab==="live")refresh()},2000);
</script>
</body>
